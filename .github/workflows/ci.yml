name: Verify web and backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --workspace @radio-ai/backend
      - run: npm run typecheck:backend
      - run: npm run build
      - run: npm run build:backend
      - run: docker build --file services/backend/Dockerfile --tag radio-ai-backend:ci .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
